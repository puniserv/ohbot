[project]
name = "ohbotchat"
version = "0.1.0"
description = "Polish voice chat for the Ohbot robot via OpenAI"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai>=3.57",
    "sounddevice",
    "numpy",
    "webrtcvad-wheels",
    "fastapi",
    "uvicorn",
    "ohbot",
    "websockets>=17.4",
    "opencv-python-headless>=4.10,<5",
]

[project.scripts]
ohbotchat = "ohbotchat.__main__:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
desktop = [
    "pywebview>=6.2.1",
]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohbotchat"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
