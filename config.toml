# Model choice verified 2026-11-21 against developers.openai.com/api/docs (models, speech-to-text, text-to-speech).
# Doctor (ohbotchat doctor) checks that these ids exist for the key in use.

[openai]
# Recommended file-transcription model; Polish is requested via `languages = ["pl"]`.
# (whisper-1 / gpt-4o-*-transcribe are deprecated, shutdown 2027-02-26.)
stt_model = "gpt-transcribe"
# Current small, cheap tier. gpt-6-luna is cheaper still if quality is enough.
chat_model = "gpt-5.4-mini"
# Only non-Realtime TTS left; Polish follows Whisper language list. Shutdown announced 2027-01-06.
tts_model = "gpt-4o-mini-tts"
# Docs recommend marin or cedar for best quality.
tts_voice = "cedar"  # male; female: marin. Others: ash, onyx
moderation_model = "omni-moderation-latest"
# The JSON wrapper ({"text": ..., "gesture": ...}) costs about 20 tokens on top of the reply.
max_tokens = 200
timeout_s = 10
# gpt-5.x are reasoning models: reasoning tokens would eat max_tokens and leave an empty reply.
reasoning_effort = "none"

[conversation]
persona = "dzieci"
history_turns = 10
mode = "ptt"
max_record_s = 30
# Spoken on "Nowa rozmowa" and once at startup when the robot is connected; cached per voice.
greeting = "Cześć! Jestem Ohbot. O czym porozmawiamy?"
# A short "Hmm…" when the reply is slow, so the child knows the robot heard them.
fillers = true

[wake]
words = ["ohbot", "hej ohbot", "ochbot", "obot", "ołbot"]
# After a bare "Ohbot!" the next utterance within this many seconds needs no wake word.
window_s = 8

[vad]
aggressiveness = 2
silence_ms = 800
min_speech_ms = 300

[barge_in]
enabled = false
threshold = 0.15
hold_ms = 300

[colours]
idle = [0, 0, 3]
listening = [0, 10, 0]
thinking = [0, 0, 10]
speaking = [10, 10, 10]
error = [10, 0, 0]

[robot]
# Flip a lip if the mouth opens the wrong way on the real robot.
lip_invert_top = false
lip_invert_bottom = false
lip_delay_ms = 0
# Mouth closed / fully open (0-10). Lower lip_closed if the mouth stays open, raise it if the lips press.
lip_closed = 1.5
lip_open = 6.5
# Each gesture step glides over gesture_step_s (eased in 0.05 s points) at servo speed gesture_speed (1-10).
gesture_step_s = 0.25
gesture_speed = 8
# 0.5-1.5: shrinks or widens gestures around the rest pose.
gesture_scale = 1.0
# Head and eyes glide to their target: each 0.1 s tick covers head_rate/eye_rate of the gap, the head at most
# head_max_step. head_speed (1-10) is the servo speed of those small steps; lower it if the head stutters.
head_rate = 0.3
head_max_step = 0.4
head_speed = 3
eye_rate = 0.6

[camera]
# Face tracking. Frames stay in the app: never saved, logged or sent anywhere.
enabled = true
# 0 = built-in camera; try 1 or 2 for a USB camera.
index = 0
# Flip if the robot looks away from the child instead of at them.
mirror = true
# Camera beside the robot: shift (-1..1) until it looks at a child straight in front of it.
offset_x = 0.0
offset_y = 0.0
# How far head and eyes turn for a face at the edge of the picture (0-15).
head_gain = 3.0
eye_gain = 10.0
# The head ignores target changes smaller than this (detector jitter); once it moves it glides all the way.
deadband = 0.5
# 0 = jumpy, 0.95 = slow and smooth.
smoothing = 0.5
# Detector confidence (0.3-0.99); raise it if posters or shadows count as faces.
min_score = 0.7
# Seconds without a face before the head recentres and looks around again.
lost_after_s = 3.0
# Greet a child who walks up after nobody was there for greet_cooldown_s.
auto_greet = true
greet_cooldown_s = 60.0
